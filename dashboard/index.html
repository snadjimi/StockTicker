<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockPulse — Signal Accuracy</title>
  <style>
    :root {
      --bg: #080C10;
      --surface: #0D1318;
      --border: #1A2530;
      --green: #00FF88;
      --red: #FF4560;
      --neutral: #7A8A9A;
      --text: #E6EDF3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 48px 24px;
      line-height: 1.5;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    header { margin-bottom: 40px; }
    h1 {
      font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 10px;
    }
    .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 12px var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .sub { color: var(--neutral); font-size: 14px; margin-top: 6px; }

    .hero {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px; text-align: center; margin-bottom: 24px;
    }
    .hero .big { font-size: 64px; font-weight: 700; letter-spacing: -2px; }
    .hero .label { color: var(--neutral); font-size: 14px; text-transform: uppercase;
      letter-spacing: 1px; margin-top: 4px; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .card .k { color: var(--neutral); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    .card .v { font-size: 26px; font-weight: 600; margin-top: 8px; }
    .bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: 3px; }

    table { width: 100%; border-collapse: collapse; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
    th { color: var(--neutral); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    tr:last-child td { border-bottom: none; }
    .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
    .green { color: var(--green); } .red { color: var(--red); } .neutral { color: var(--neutral); }
    .tag.green { background: rgba(0,255,136,.12); }
    .tag.red { background: rgba(255,69,96,.12); }
    .tag.neutral { background: rgba(122,138,154,.12); }

    .state { text-align: center; padding: 60px 20px; color: var(--neutral); }
    .state h2 { color: var(--text); font-weight: 600; margin-bottom: 8px; }
    h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--neutral); margin: 32px 0 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="pulse"></span> StockPulse</h1>
      <div class="sub">Backtested accuracy of AI-generated sentiment signals</div>
    </header>
    <div id="content">
      <div class="state"><h2>Loading…</h2><p>Fetching signal data.</p></div>
    </div>
  </div>

  <script>
    async function loadConfig() {
      try {
        const res = await fetch("config.json", { cache: "no-store" });
        if (!res.ok) throw new Error();
        return await res.json();
      } catch {
        return null;
      }
    }

    function pct(x) { return x == null ? "—" : (x * 100).toFixed(1) + "%"; }
    function signed(x) { return x == null ? "—" : (x >= 0 ? "+" : "") + x.toFixed(2) + "%"; }
    function color(c) { return c === true ? "green" : c === false ? "red" : "neutral"; }
    function accColor(r) { return r == null ? "var(--neutral)" : r >= 0.5 ? "var(--green)" : "var(--red)"; }

    function render(s) {
      const content = document.getElementById("content");

      if (!s.accuracy || s.accuracy.sampleSize === 0) {
        content.innerHTML = `
          <div class="state">
            <h2>Collecting data</h2>
            <p>${s.totals.pending} signal(s) logged and seasoning. Accuracy appears
            once predictions mature (~7 days) and get graded.</p>
          </div>`;
        return;
      }

      const a = s.accuracy, r = s.avgReturn, b = s.bySentiment;
      content.innerHTML = `
        <div class="hero">
          <div class="big" style="color:${accColor(a.overall)}">${pct(a.overall)}</div>
          <div class="label">Overall hit rate · ${a.sampleSize} graded signals</div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="k">Bullish accuracy</div>
            <div class="v green">${pct(a.bullish)}</div>
            <div class="bar"><span style="width:${(a.bullish||0)*100}%;background:var(--green)"></span></div>
            <div class="sub">${b.bullish.correct}/${b.bullish.count} correct</div>
          </div>
          <div class="card">
            <div class="k">Bearish accuracy</div>
            <div class="v red">${pct(a.bearish)}</div>
            <div class="bar"><span style="width:${(a.bearish||0)*100}%;background:var(--red)"></span></div>
            <div class="sub">${b.bearish.correct}/${b.bearish.count} correct</div>
          </div>
          <div class="card">
            <div class="k">Avg return / signal</div>
            <div class="v" style="color:${(r.overall||0)>=0?'var(--green)':'var(--red)'}">${signed(r.overall)}</div>
            <div class="sub">+${signed(r.whenCorrect)} when right · ${signed(r.whenWrong)} when wrong</div>
          </div>
        </div>

        <h3>Recent signals</h3>
        <table>
          <thead><tr><th>Ticker</th><th>Date</th><th>Call</th><th>Score</th><th>Result</th><th>Return</th></tr></thead>
          <tbody>
            ${s.recent.map(row => `
              <tr>
                <td><strong>${row.ticker}</strong></td>
                <td class="neutral">${(row.timestamp||"").slice(0,10)}</td>
                <td><span class="tag ${row.sentimentLabel==='Bullish'?'green':row.sentimentLabel==='Bearish'?'red':'neutral'}">${row.sentimentLabel}</span></td>
                <td>${row.sentimentScore ?? "—"}</td>
                <td class="${color(row.correct)}">${!row.graded ? "pending" : row.correct === true ? "✓ correct" : row.correct === false ? "✗ wrong" : "neutral"}</td>
                <td class="${(row.returnPct||0)>=0?'green':'red'}">${signed(row.returnPct)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
        <div class="sub" style="margin-top:16px;text-align:center">
          Updated ${new Date(s.generatedAt).toLocaleString()} · ${s.totals.signals} total signals · ${s.totals.pending} pending
        </div>`;
    }

    (async function init() {
      const config = await loadConfig();
      if (!config || !config.apiUrl) {
        document.getElementById("content").innerHTML =
          `<div class="state"><h2>Not configured</h2><p>config.json is missing the API URL.</p></div>`;
        return;
      }
      try {
        const res = await fetch(config.apiUrl + "stats", { cache: "no-store" });
        if (!res.ok) throw new Error("stats " + res.status);
        render(await res.json());
      } catch (err) {
        document.getElementById("content").innerHTML =
          `<div class="state"><h2>Couldn't load stats</h2><p>${err.message}</p></div>`;
      }
    })();
  </script>
</body>
</html>
